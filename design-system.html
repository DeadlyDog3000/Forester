or:#e0d3ac\">34px<\u002Fspan><\u002Fdiv>\n            <div>Sheet height — <span style=\"color:#e0d3ac\">33vh<\u002Fspan>, 46vh for the reckoning<\u002Fdiv>\n            <div>Pad lane — sheets stop <span style=\"color:#e0d3ac\">56–58px<\u002Fspan> short of the right edge<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#5a6b60;line-height:1.55;margin-top:12px\">The pad always keeps a lane of its own. A sheet that runs under it buries the controls the player needs to close the sheet.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #2e4136;padding-bottom:8px\">\n        <div style=\"font-size:11px;color:#7a8f83;letter-spacing:2px\">07<\u002Fdiv>\n        <div style=\"font-size:20px;color:#c9a86a;letter-spacing:3px\">ART &amp; MARKS<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#8fa397;line-height:1.6;margin-top:12px;max-width:780px\">Every picture in the game is pixel art on a 32px tile — ground at 64, portraits and event plates larger — and every one of them is drawn with <span style=\"color:#e0d3ac\">image-rendering: pixelated<\u002Fspan>. There is no vector iconography and no icon font: interface icons are single emoji glyphs in an <span style=\"color:#e0d3ac\">&lt;i class=\"ico\"&gt;<\u002Fspan>, and everything else is a sprite.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:22px\">\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;text-align:center\">\n          <div style=\"height:96px;display:flex;align-items:center;justify-content:center;background:#101813;border:1px solid #24352b;overflow:hidden\"><img src=\"63e8f741-3d13-41ea-9e81-1cd6e80fdac6\" alt=\"\" style=\"image-rendering:pixelated;max-width:100%;max-height:100%\"><\u002Fdiv>\n          <div style=\"font-size:11px;color:#e6ece8;margin-top:8px\">log_cabin_32<\u002Fdiv>\n          <div style=\"font-size:10px;color:#7a8f83;margin-top:2px\">Buildings — 32px tile<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;text-align:center\">\n          <div style=\"height:96px;display:flex;align-items:center;justify-content:center;background:#101813;border:1px solid #24352b;overflow:hidden\"><img src=\"a6208fb0-89fb-4518-9009-711997360559\" alt=\"\" style=\"image-rendering:pixelated;max-width:100%;max-height:100%\"><\u002Fdiv>\n          <div style=\"font-size:11px;color:#e6ece8;margin-top:8px\">forge_32<\u002Fdiv>\n          <div style=\"font-size:10px;color:#7a8f83;margin-top:2px\">Every building has a _w winter twin<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;text-align:center\">\n          <div style=\"height:96px;display:flex;align-items:center;justify-content:center;background:#101813;border:1px solid #24352b;overflow:hidden\"><img src=\"c45064a6-d286-4f5c-b78f-f84683008f07\" alt=\"\" style=\"image-rendering:pixelated;max-width:100%;max-height:100%\"><\u002Fdiv>\n          <div style=\"font-size:11px;color:#e6ece8;margin-top:8px\">burned_house_32<\u002Fdiv>\n          <div style=\"font-size:10px;color:#7a8f83;margin-top:2px\">And a burned ruin<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;text-align:center\">\n          <div style=\"height:96px;display:flex;align-items:center;justify-content:center;background:#101813;border:1px solid #24352b;overflow:hidden\"><img src=\"0568e7a8-04f5-4cee-9e5e-88c9a06ea977\" alt=\"\" style=\"image-rendering:pixelated;max-width:100%;max-height:100%\"><\u002Fdiv>\n          <div style=\"font-size:11px;color:#e6ece8;margin-top:8px\">spruce_tree_32<\u002Fdiv>\n          <div style=\"font-size:10px;color:#7a8f83;margin-top:2px\">World objects — 32px<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;text-align:center\">\n          <div style=\"height:96px;display:flex;align-items:center;justify-content:center;background:#101813;border:1px solid #24352b;overflow:hidden\"><img src=\"fcea672e-7553-419c-b61f-871511fd57e8\" alt=\"\" style=\"image-rendering:pixelated;max-width:100%;max-height:100%\"><\u002Fdiv>\n          <div style=\"font-size:11px;color:#e6ece8;margin-top:8px\">stone_32<\u002Fdiv>\n          <div style=\"font-size:10px;color:#7a8f83;margin-top:2px\">Resources, same tile<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;text-align:center\">\n          <div style=\"height:96px;display:flex;align-items:center;justify-content:center;background:#101813;border:1px solid #24352b;overflow:hidden\"><img src=\"74e77bb6-0c24-49b8-8567-9b092d0a91b7\" alt=\"\" style=\"image-rendering:pixelated;max-width:100%;max-height:100%\"><\u002Fdiv>\n          <div style=\"font-size:11px;color:#e6ece8;margin-top:8px\">soldier_walk_0<\u002Fdiv>\n          <div style=\"font-size:10px;color:#7a8f83;margin-top:2px\">Characters — 4-frame cycles<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;text-align:center\">\n          <div style=\"height:96px;display:flex;align-items:center;justify-content:center;background:#101813;border:1px solid #24352b;overflow:hidden\"><img src=\"44107a33-dde2-4372-94d8-d51220d1e22b\" alt=\"\" style=\"image-rendering:pixelated;max-width:100%;max-height:100%\"><\u002Fdiv>\n          <div style=\"font-size:11px;color:#e6ece8;margin-top:8px\">hunter_walk_0<\u002Fdiv>\n          <div style=\"font-size:10px;color:#7a8f83;margin-top:2px\">One per trade<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;text-align:center\">\n          <div style=\"height:96px;display:flex;align-items:center;justify-content:center;background:#101813;border:1px solid #24352b;overflow:hidden\"><img src=\"1a6ee289-8ce6-4518-8095-ae9c24e55341\" alt=\"\" style=\"image-rendering:pixelated;max-width:100%;max-height:100%\"><\u002Fdiv>\n          <div style=\"font-size:11px;color:#e6ece8;margin-top:8px\">hunter_face_a<\u002Fdiv>\n          <div style=\"font-size:10px;color:#7a8f83;margin-top:2px\">Talk portraits — 96px<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;text-align:center\">\n          <div style=\"height:96px;display:flex;align-items:center;justify-content:center;background:#101813;border:1px solid #24352b;overflow:hidden\"><img src=\"06c738a2-90ca-4b6a-8eef-7ee1487df0af\" alt=\"\" style=\"image-rendering:pixelated;max-width:100%;max-height:100%\"><\u002Fdiv>\n          <div style=\"font-size:11px;color:#e6ece8;margin-top:8px\">leader_king<\u002Fdiv>\n          <div style=\"font-size:10px;color:#7a8f83;margin-top:2px\">Foreign leaders<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;text-align:center\">\n          <div style=\"height:96px;display:flex;align-items:center;justify-content:center;background:#101813;border:1px solid #24352b;overflow:hidden\"><img src=\"dcc0ee80-b027-4597-84c4-e818f3e0cb6c\" alt=\"\" style=\"image-rendering:pixelated;max-width:100%;max-height:100%\"><\u002Fdiv>\n          <div style=\"font-size:11px;color:#e6ece8;margin-top:8px\">grass_64<\u002Fdiv>\n          <div style=\"font-size:10px;color:#7a8f83;margin-top:2px\">Ground — 64px tile<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:16px;margin-top:18px\">\n        <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:12px\">THE GLYPHS IN USE, AND WHAT THEY MEAN<\u002Fdiv>\n        <div style=\"display:flex;gap:26px;flex-wrap:wrap;font-size:11.5px;color:#b9c6bd;line-height:1.7\">\n          <span><span style=\"font-size:15px\">🏗<\u002Fspan> build<\u002Fspan>\n          <span><span style=\"font-size:15px\">⚒<\u002Fspan> craft<\u002Fspan>\n          <span><span style=\"font-size:15px\">🛣<\u002Fspan> roads<\u002Fspan>\n          <span><span style=\"font-size:15px\">🏛<\u002Fspan> government<\u002Fspan>\n          <span><span style=\"font-size:15px\">⚔<\u002Fspan> military &amp; war<\u002Fspan>\n          <span><span style=\"font-size:15px\">👥<\u002Fspan> the roll<\u002Fspan>\n          <span><span style=\"font-size:15px\">📜<\u002Fspan> the chronicle<\u002Fspan>\n          <span><span style=\"font-size:15px\">🗺<\u002Fspan> the map<\u002Fspan>\n          <span><span style=\"font-size:15px\">🔥<\u002Fspan> the torch<\u002Fspan>\n          <span><span style=\"font-size:15px\">↻<\u002Fspan> turn a wall<\u002Fspan>\n          <span><span style=\"font-size:15px\">✕<\u002Fspan> cancel<\u002Fspan>\n          <span><span style=\"font-size:15px\">⌂<\u002Fspan> home<\u002Fspan>\n          <span><span style=\"font-size:15px\">☰<\u002Fspan> pause<\u002Fspan>\n          <span><span style=\"font-size:15px\">✦<\u002Fspan> ambitions<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:10.5px;color:#5a6b60;line-height:1.55;margin-top:12px\">One glyph per idea, and the same glyph everywhere that idea appears. On a phone the label is hidden and the glyph goes to 15px with the right margin removed — the icon becomes the whole button.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #2e4136;padding-bottom:8px\">\n        <div style=\"font-size:11px;color:#7a8f83;letter-spacing:2px\">08<\u002Fdiv>\n        <div style=\"font-size:20px;color:#c9a86a;letter-spacing:3px\">THE VOICE<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#8fa397;line-height:1.6;margin-top:12px;max-width:780px\">The interface talks like a chronicler in 1683, not like software. It says <span style=\"color:#e0d3ac\">the roll of the colony<\u002Fspan>, not \"population list\"; <span style=\"color:#e0d3ac\">word from afar<\u002Fspan>, not \"notification\"; <span style=\"color:#e0d3ac\">lay the ledger down<\u002Fspan>, not \"end game\". Sentences are plain, concrete, and often about people by name.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px\">\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:16px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#9ecf9a;border-bottom:1px solid #2c4030;padding-bottom:4px;margin-bottom:12px\">SAY IT LIKE THIS<\u002Fdiv>\n          <sc-for list=\"{{ saidWell }}\" as=\"v\" hint-placeholder-count=\"6\">\n            <div style=\"font-size:12px;line-height:1.6;color:#dde5df;padding:6px 0;border-bottom:1px solid #182219\">{{ v }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:16px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#d8a0a0;border-bottom:1px solid #4a2f2f;padding-bottom:4px;margin-bottom:12px\">NOT LIKE THIS<\u002Fdiv>\n          <sc-for list=\"{{ saidBadly }}\" as=\"v\" hint-placeholder-count=\"6\">\n            <div style=\"font-size:12px;line-height:1.6;color:#8fa397;padding:6px 0;border-bottom:1px solid #182219\">{{ v }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:16px;margin-top:18px\">\n        <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:12px\">THE HABITS OF THE PROSE<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;font-size:11.5px;line-height:1.6;color:#b9c6bd\">\n          <div><b style=\"color:#c9a86a;font-weight:normal\">Em dash, not colon.<\u002Fb> A cost, a consequence or an aside follows an em dash: \"Forge — 20 logs, 6 stone, 2 iron\".<\u002Fdiv>\n          <div><b style=\"color:#c9a86a;font-weight:normal\">Caps for labels only.<\u002Fb> A heading shouts; a sentence never does. No title case anywhere.<\u002Fdiv>\n          <div><b style=\"color:#c9a86a;font-weight:normal\">Name the person.<\u002Fb> \"Klaus Enders did not come back in\" beats \"1 unit lost\".<\u002Fdiv>\n          <div><b style=\"color:#c9a86a;font-weight:normal\">Say the cause.<\u002Fb> A refusal explains itself in the same breath: \"No stone in the store — the quarry is that way\".<\u002Fdiv>\n          <div><b style=\"color:#c9a86a;font-weight:normal\">Touch copy is separate.<\u002Fb> Every instruction carries a <span style=\"color:#e0d3ac\">data-touch<\u002Fspan> twin: \"Click a person\" becomes \"Tap a person\".<\u002Fdiv>\n          <div><b style=\"color:#c9a86a;font-weight:normal\">No exclamation, no emoji in prose.<\u002Fb> Glyphs are controls. The writing keeps its composure.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #2e4136;padding-bottom:8px\">\n        <div style=\"font-size:11px;color:#7a8f83;letter-spacing:2px\">09<\u002Fdiv>\n        <div style=\"font-size:20px;color:#c9a86a;letter-spacing:3px\">WHEN YOU ADD SOMETHING NEW<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px\">\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #2c4030;padding:16px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#9ecf9a;border-bottom:1px solid #2c4030;padding-bottom:4px;margin-bottom:12px\">DO<\u002Fdiv>\n          <sc-for list=\"{{ dos }}\" as=\"v\" hint-placeholder-count=\"7\">\n            <div style=\"font-size:12px;line-height:1.6;color:#dde5df;padding:6px 0;border-bottom:1px solid #182219\">{{ v }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #4a2f2f;padding:16px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#d8a0a0;border-bottom:1px solid #4a2f2f;padding-bottom:4px;margin-bottom:12px\">DON'T<\u002Fdiv>\n          <sc-for list=\"{{ donts }}\" as=\"v\" hint-placeholder-count=\"7\">\n            <div style=\"font-size:12px;line-height:1.6;color:#8fa397;padding:6px 0;border-bottom:1px solid #182219\">{{ v }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:56px;border-top:1px solid #2c3b32;padding-top:18px;display:flex;gap:20px;flex-wrap:wrap;font-size:10.5px;color:#5a6b60;letter-spacing:1px\">\n      <span>DRAWN FROM index.html, game.js AND assets/palette.gpl<\u002Fspan>\n      <span style=\"flex:1\"><\u002Fspan>\n      <span>FORESTER beta — DeadlyDog Productions<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:1600}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const S = (bg) => ({ background: bg });\n    const surfaces = [\n      { hex: \"#0d1210\", name: \"Night Floor\", use: \"The page itself, the loading screen, the theme-color meta.\" },\n      { hex: \"rgba(13,18,16,0.93)\", name: \"Panel Glass\", use: \"Every floating panel, bar and sheet. Never opaque.\" },\n      { hex: \"#14201a\", name: \"Menu Fill\", use: \"Dropped menus, chips at rest, tech nodes.\" },\n      { hex: \"#1c2a21\", name: \"Button Fill\", use: \"The resting state of every .btn, and a finished tech node.\" },\n      { hex: \"#24352b\", name: \"Raised\", use: \"Hover fill on buttons, menu items and chips.\" },\n      { hex: \"#101813\", name: \"The Well\", use: \"Sunk into a panel: inputs, meter tracks, list frames.\" },\n      { hex: \"#0f1713\", name: \"Graph Bed\", use: \"The scrollable field behind the tech graph.\" },\n      { hex: \"#16231b\", name: \"Row Wash\", use: \"Hover on a chronicle or roll row. The faintest state in the game.\" },\n      { hex: \"rgba(9,13,11,0.96)\", name: \"Overlay\", use: \"The map of Europe, and the event card at 0.9.\" },\n      { hex: \"#050807\", name: \"Cutscene Black\", use: \"Behind a story plate. Darker than anything else.\" }\n    ].map(c => ({ ...c, sw: c.hex }));\n\n    const lines = [\n      { hex: \"#3a5243\", name: \"Spruce Grey\", use: \"The primary edge. Every panel, button, input and frame.\" },\n      { hex: \"#24352b\", name: \"Inner Hairline\", use: \"Rules inside a panel: hr, list frames, meter tracks.\" },\n      { hex: \"#182219\", name: \"Row Divider\", use: \"Between rows of a record. Almost invisible, on purpose.\" },\n      { hex: \"#2c3b32\", name: \"Section Rule\", use: \"Under a help-panel section head.\" },\n      { hex: \"#2e4136\", name: \"Year Rule\", use: \"Under a year in the chronicle, and under a page head.\" },\n      { hex: \"#7da083\", name: \"Live Edge\", use: \"The edge of an active button, chip, or finished tech.\" },\n      { hex: \"#c9a86a\", name: \"Gold Edge\", use: \"Available tech, the tutorial banner, an important frame.\" },\n      { hex: \"#4a2f2f\", name: \"Rust Hairline\", use: \"A downward mood chip, a delete button at rest.\" },\n      { hex: \"#7a4040\", name: \"Rust Edge\", use: \"A danger button. The only red border on a control.\" },\n      { hex: \"#8a7746\", name: \"Tarnished Gold\", use: \"The event card only. Warmer than gold, quieter.\" }\n    ];\n\n    const ink = [\n      { hex: \"#e6ece8\", sample: \"A name in a list\", use: \"Brightest ink. A person's name, a settlement, a heading in a row.\" },\n      { hex: \"#dde5df\", sample: \"What happened here\", use: \"Chronicle prose — the sentence itself.\" },\n      { hex: \"#cfd8d3\", sample: \"Body and buttons\", use: \"The default. Body copy, button labels, input text.\" },\n      { hex: \"#b9c6bd\", sample: \"What a thing is for\", use: \"Explanatory prose inside a panel.\" },\n      { hex: \"#a8bcae\", sample: \"A secondary value\", use: \"Chip text, a trade, a right-hand value.\" },\n      { hex: \"#9ab0a2\", sample: \"A subtitle under a title\", use: \"Menu subtitle, map detail, modal preamble.\" },\n      { hex: \"#8fa397\", sample: \"A stat label\", use: \"The left side of a numbers row. Also #93a89a, #7d9187 in records.\" },\n      { hex: \"#7a8f83\", sample: \"A quiet note\", use: \"Timestamps, slot numbers, small print with weight.\" },\n      { hex: \"#5a6b60\", sample: \"The whisper\", use: \"Footnotes, [close], the beta mark. The floor of legibility.\" }\n    ];\n\n    const accents = [\n      { hex: \"#c9a86a\", name: \"Gold\", use: \"Names things: panel titles, HUD values, available tech.\" },\n      { hex: \"#d9b878\", name: \"Bright Gold\", use: \"A year in the chronicle, an ambition's date.\" },\n      { hex: \"#e0d3ac\", name: \"Pale Gold\", use: \"A stat's value, a reign's name.\" },\n      { hex: \"#e8d9b8\", name: \"Parchment\", use: \"Event card and tutorial prose.\" },\n      { hex: \"#f0dcae\", name: \"Called Out\", use: \"#msg, over the field. The loudest ink in the game.\" },\n      { hex: \"#7da083\", name: \"Spruce\", use: \"Section heads, meter fills, confirmations, accent-color.\" },\n      { hex: \"#9ecf9a\", name: \"Good\", use: \"An upward mood, a life event, a finished node's text.\" },\n      { hex: \"#a05252\", name: \"Health Fill\", use: \"The health bar. Muted, never alarming.\" },\n      { hex: \"#d8a0a0\", name: \"Rust Ink\", use: \"Danger button text, a downward mood, a hurt soul.\" },\n      { hex: \"#d86a5a\", name: \"Blood\", use: \"Death, war, THE COLONY IS GONE. Used sparingly.\" },\n      { hex: \"#a99ec4\", name: \"Fever\", use: \"Illness, and nothing else.\" },\n      { hex: \"#d8a05a\", name: \"Law\", use: \"An edict in the record.\" },\n      { hex: \"#e0ac63\", name: \"Tag\", use: \"A trait beside a name on the roll.\" },\n      { hex: \"#ffe9b0\", name: \"Map Light\", use: \"Settlement marks on the map of Europe only.\" }\n    ];\n\n    const measures = [\n      { k: \"Border radius\", v: \"0 everywhere — except a tech node (8) and a touch button (50%)\" },\n      { k: \"Border width\", v: \"1px, always. Docked bars keep one side only\" },\n      { k: \"Panel padding\", v: \"10 / 12 / 14 / 16 / 18px — 6–8px in a phone sheet\" },\n      { k: \"Bar padding\", v: \"7px 12px (HUD) · 8px 14px (actions)\" },\n      { k: \"Button padding\", v: \"7px 12px · 5px 8px small · 12px 40px on a title card\" },\n      { k: \"Row gap\", v: \"3px between value rows, 6px between stacked buttons\" },\n      { k: \"Flex gap\", v: \"6 / 8 / 10 / 13px. The HUD runs 13, the action bar 8\" },\n      { k: \"Panel widths\", v: \"240 civ · 280 gov · 318 building · 470 talk · 520 help · 560 reckoning · 720 records · 760 tech\" },\n      { k: \"Meter height\", v: \"10px in a panel · 12px for willingness · 8px inline · 6px in a sheet\" },\n      { k: \"Panel offsets\", v: \"top: 48px under the HUD · 10px from the side · bottom: 50px above the action bar\" }\n    ];\n\n    const layers = [\n      { z: \"5\", what: \"#hint\", note: \"The keys line under the HUD. Below everything.\" },\n      { z: \"10\", what: \".panel\", note: \"The HUD, the action bar, and every docked panel.\" },\n      { z: \"15–20\", what: \"Tech panel, dropdowns, tutorial\", note: \"A menu must clear the bar it grew out of.\" },\n      { z: \"24–34\", what: \"Touch pad, phone sheets\", note: \"The pad outranks a sheet so it can never be buried.\" },\n      { z: \"40–60\", what: \"Records, reckoning, event card, siege menu\", note: \"Things that cover the field but not the world.\" },\n      { z: \"90–96\", what: \"Map overlay, modals, #msg, pause\", note: \"#msg sits at 96 — a refusal must clear the pause screen.\" },\n      { z: \"100–120\", what: \"Main menu, loading, game over\", note: \"The game is not running behind these.\" },\n      { z: \"125–135\", what: \"Cutscene, empire naming, cargo, talk\", note: \"A talk sits above the map so leaders can speak there.\" },\n      { z: \"140–141\", what: \"Settings, help, skills, military\", note: \"Reachable from anywhere, so they must cover anything.\" }\n    ];\n\n    const barRules = [\n      { k: \"Track\", v: \"#101813 inside a 1px #24352b border. No radius.\" },\n      { k: \"Fill\", v: \"Flat #7da083. Health alone uses #a05252.\" },\n      { k: \"Height\", v: \"10px standing, 8px inline in a row, 6px in a phone sheet.\" },\n      { k: \"Label\", v: \"Never inside the bar. The number goes in the row above, right-aligned.\" },\n      { k: \"Motion\", v: \"None, except willingness, which eases width over 0.3s.\" }\n    ];\n\n    const eventInks = [\n      { glyph: \"✦\", label: \"life\", hex: \"#9ecf9a\" },\n      { glyph: \"⚔\", label: \"death & war\", hex: \"#d86a5a\" },\n      { glyph: \"☠\", label: \"illness\", hex: \"#a99ec4\" },\n      { glyph: \"§\", label: \"law\", hex: \"#d8a05a\" },\n      { glyph: \"◦\", label: \"everything else\", hex: \"#8fbf95\" }\n    ];\n\n    const phoneRules = [\n      { head: \"PANELS BECOME SHEETS\", body: \"top:auto; bottom:50px; left/right:6px; max-height:33vh. The woods stay in view above them. The reckoning gets 46vh.\" },\n      { head: \"LABELS LEAVE THE BUTTONS\", body: \"Eight buttons at full width need 900px and a phone has 375. The .txt span is hidden and the glyph goes to 15px — the icon becomes the whole button.\" },\n      { head: \"THE HUD REORDERS\", body: \"The clock, the season and the head-count are pulled to the front with order:-1/-2/-3. Stores are what you scroll for, and only when you are about to build.\" },\n      { head: \"ROWS BECOME STACKS\", body: \"A help row puts its label above its line rather than beside it. 520px of panel on a 375px phone hung off both edges.\" },\n      { head: \"MENUS GO FIXED\", body: \"A dropdown becomes a fixed sheet at left:8/right:8/bottom:52 with max-height 42vh, instead of a floating box off the edge.\" },\n      { head: \"SAFE AREAS ARE HONOURED\", body: \"The HUD pads to env(safe-area-inset-top); the action bar to env(safe-area-inset-bottom). Never assume the screen is rectangular.\" }\n    ];\n\n    const saidWell = [\n      \"The roll of the colony\",\n      \"Word from afar\",\n      \"Lay the ledger down\",\n      \"Hamburg, 1683. They took everything. Build it back.\",\n      \"The homeless freeze in winter and pay no tax.\",\n      \"Skills rise on their own with the work — a man who chops all season gets better at chopping.\",\n      \"Leave it be for a forest drawn at random, or write a word and get that same forest every time.\"\n    ];\n\n    const saidBadly = [\n      \"Population list\",\n      \"Notification\",\n      \"End game session\",\n      \"Welcome to Forester! Let's get started.\",\n      \"Warning: homeless units suffer a happiness penalty.\",\n      \"Skills increase automatically based on activity XP.\",\n      \"Optional: enter a seed value to generate a deterministic map.\"\n    ];\n\n    const dos = [\n      \"Start from .panel. If it floats, it is glass on a spruce hairline.\",\n      \"Pick a colour from the list above, or use none. A new hue needs a new meaning.\",\n      \"Put the number in the row and the bar underneath it.\",\n      \"Give the thing a z-index from the ledger before you build it.\",\n      \"Write the phone rules in the same breath as the desk ones — 820px, one query.\",\n      \"Write the copy as a chronicler would, and give every instruction a data-touch twin.\",\n      \"Set image-rendering: pixelated on every picture, without exception.\"\n    ];\n\n    const donts = [\n      \"No border radius, no soft shadow, no blur. The one shadow belongs to the event card.\",\n      \"No second typeface, and no bold. Emphasis is colour.\",\n      \"No gradient except the willingness meter.\",\n      \"No saturated hue in chrome — blue, purple and orange belong to the player and the world.\",\n      \"No text below 10px on a desk or 11px in a sheet.\",\n      \"Nothing centred across the middle of the field. The player's town owns that space.\",\n      \"No title case, no exclamation marks, no emoji inside a sentence.\"\n    ];\n\n    return { surfaces, lines, ink, accents, measures, layers, barRules, eventInks, phoneRules, saidWell, saidBadly, dos, donts };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
