document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"0982ef76-cf58-421b-9f54-7dec66b22d15\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<style>\n  body { margin: 0; background: #0b0f0d; }\n  a { color: #c9a86a; text-decoration: none; border-bottom: 1px solid #3a5243; }\n  a:hover { color: #e0d3ac; border-bottom-color: #7da083; }\n  ::selection { background: #3a5243; color: #f0f6ee; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:#0b0f0d;font-family:'Courier New',monospace;color:#cfd8d3;min-height:100vh;padding:0 0 90px\">\n\n  <div style=\"position:relative;background:#0d1210;border-bottom:1px solid #3a5243;overflow:hidden\">\n    <img src=\"b2ffd4cc-c405-4b72-a194-23bd78aeee89\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;opacity:0.38\">\n    <div style=\"position:absolute;inset:0;background:rgba(13,18,16,0.55)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1180px;margin:0 auto;padding:74px 40px 58px\">\n      <div style=\"font-size:11px;letter-spacing:3px;color:#7da083;margin-bottom:18px\">THE PATTERN OF THE BUILD<\u002Fdiv>\n      <div style=\"font-size:52px;letter-spacing:14px;color:#cfd8d3;text-shadow:0 3px 0 #000;line-height:1\">FORESTER<\u002Fdiv>\n      <div style=\"font-size:13px;color:#9ab0a2;text-shadow:0 1px 2px #000;margin-top:16px;max-width:620px;line-height:1.6\">The interface as it already stands — every surface, hairline, hex and habit drawn out of the running game so the next panel matches the last one without guessing.<\u002Fdiv>\n      <div style=\"display:flex;gap:26px;margin-top:30px;flex-wrap:wrap;font-size:11px;color:#7a8f83;letter-spacing:1px\">\n        <span>ONE FAMILY — COURIER NEW<\u002Fspan>\n        <span>ZERO RADIUS<\u002Fspan>\n        <span>1PX HAIRLINES<\u002Fspan>\n        <span>beta — DeadlyDog Productions<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 40px\">\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:38px\">\n      <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:14px\">\n        <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:9px\">THE ONE RULE<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.6;color:#b9c6bd\">Nothing is rounded, nothing is soft. Every edge is a single hairline of spruce grey. If a thing looks like glass laid over the woods, it is right.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:14px\">\n        <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:9px\">THE TWO ACCENTS<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.6;color:#b9c6bd\"><b style=\"color:#c9a86a;font-weight:normal\">Gold<\u002Fb> names things and marks what is available. <b style=\"color:#7da083;font-weight:normal\">Spruce<\u002Fb> confirms, measures and labels sections. Nothing else earns a colour.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:14px\">\n        <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:9px\">THE THREE VOICES<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.6;color:#b9c6bd\">A label is shouted in caps. A number is bare. A sentence is prose, written like a chronicle and never like a tooltip.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:14px\">\n        <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:9px\">THE PHONE LAW<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.6;color:#b9c6bd\">Below 820px every side panel becomes a bottom sheet of one third the screen. The woods stay in view. Type stops shrinking at 11px.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #2e4136;padding-bottom:8px\">\n        <div style=\"font-size:11px;color:#7a8f83;letter-spacing:2px\">01<\u002Fdiv>\n        <div style=\"font-size:20px;color:#c9a86a;letter-spacing:3px\">FOUNDATIONS — COLOUR<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#8fa397;line-height:1.6;margin-top:12px;max-width:720px\">Five families, and they do not mix. Surfaces are near-black spruce; lines are grey-green; ink is a cool off-white stepped down to a whisper; gold and spruce are the accents; and the states — hurt, ill, law, good — each hold one hue and one only.<\u002Fdiv>\n\n      <div style=\"margin-top:26px\">\n        <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:14px\">SURFACES<\u002Fdiv>\n        <sc-for list=\"{{ surfaces }}\" as=\"c\" hint-placeholder-count=\"8\">\n          <div style=\"display:inline-block;width:172px;margin:0 12px 16px 0;vertical-align:top\">\n            <div style=\"height:62px;border:1px solid #3a5243\"><div style=\"width:100%;height:100%;background:{{ c.hex }}\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#e6ece8;margin-top:6px\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-size:10.5px;color:#c9a86a;letter-spacing:0.5px\">{{ c.hex }}<\u002Fdiv>\n            <div style=\"font-size:10px;color:#7a8f83;line-height:1.45;margin-top:2px\">{{ c.use }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:22px\">\n        <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:14px\">LINES<\u002Fdiv>\n        <sc-for list=\"{{ lines }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <div style=\"display:inline-block;width:172px;margin:0 12px 16px 0;vertical-align:top\">\n            <div style=\"height:62px;background:#0f1713;padding:9px\"><div style=\"width:100%;height:100%;border:2px solid {{ c.hex }}\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#e6ece8;margin-top:6px\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-size:10.5px;color:#c9a86a;letter-spacing:0.5px\">{{ c.hex }}<\u002Fdiv>\n            <div style=\"font-size:10px;color:#7a8f83;line-height:1.45;margin-top:2px\">{{ c.use }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:22px\">\n        <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:14px\">INK — SIX STEPS DOWN FROM WHITE<\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:4px 14px\">\n          <sc-for list=\"{{ ink }}\" as=\"c\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;gap:16px;align-items:baseline;padding:9px 0;border-bottom:1px solid #182219\">\n              <div style=\"flex:0 0 88px;font-size:11px;color:#c9a86a\">{{ c.hex }}<\u002Fdiv>\n              <div style=\"flex:0 0 150px;font-size:12px;color:{{ c.hex }}\">{{ c.sample }}<\u002Fdiv>\n              <div style=\"flex:1;font-size:11px;color:#7a8f83;line-height:1.5\">{{ c.use }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:22px\">\n        <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:14px\">ACCENTS &amp; STATES<\u002Fdiv>\n        <sc-for list=\"{{ accents }}\" as=\"c\" hint-placeholder-count=\"10\">\n          <div style=\"display:inline-block;width:172px;margin:0 12px 16px 0;vertical-align:top\">\n            <div style=\"height:44px;border:1px solid #24352b;background:{{ c.hex }}\"><\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#e6ece8;margin-top:6px\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-size:10.5px;color:#c9a86a;letter-spacing:0.5px\">{{ c.hex }}<\u002Fdiv>\n            <div style=\"font-size:10px;color:#7a8f83;line-height:1.45;margin-top:2px\">{{ c.use }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:22px\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:12px\">THE SPRITE PALETTE — DARK SPRUCE<\u002Fdiv>\n          <div style=\"font-size:11px;color:#7a8f83;line-height:1.55;margin-bottom:10px\">The four-colour ramp the pixel art is drawn against. Interface colour is not the same as art colour — keep them apart, and never sample a sprite for a border.<\u002Fdiv>\n          <div style=\"display:flex\">\n            <div style=\"flex:1;height:56px;background:#051212;border:1px solid #24352b\"><\u002Fdiv>\n            <div style=\"flex:1;height:56px;background:#102422;border:1px solid #24352b;border-left:0\"><\u002Fdiv>\n            <div style=\"flex:1;height:56px;background:#2a423f;border:1px solid #24352b;border-left:0\"><\u002Fdiv>\n            <div style=\"flex:1;height:56px;background:#3f5550;border:1px solid #24352b;border-left:0\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;font-size:9.5px;color:#8fa397;margin-top:5px;letter-spacing:0.4px\">\n            <div style=\"flex:1\">#051212<br>Char Black<\u002Fdiv>\n            <div style=\"flex:1\">#102422<br>Deep Spruce<\u002Fdiv>\n            <div style=\"flex:1\">#2A423F<br>Spruce Grey<\u002Fdiv>\n            <div style=\"flex:1\">#3F5550<br>Pale Spruce<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:12px\">PLAYER COLOUR — THE ONE ESCAPE<\u002Fdiv>\n          <div style=\"font-size:11px;color:#7a8f83;line-height:1.55;margin-bottom:10px\">Three colours belong to the player, not the system: territory, border and regimental coat. They are the only saturated hues allowed on screen, and they never appear in chrome.<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\">\n            <div style=\"flex:1\">\n              <div style=\"height:38px;background:#7da083;border:1px solid #24352b\"><\u002Fdiv>\n              <div style=\"font-size:9.5px;color:#8fa397;margin-top:5px\">TERRITORY<br>#7da083 default<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1\">\n              <div style=\"height:38px;background:#c9a86a;border:1px solid #24352b\"><\u002Fdiv>\n              <div style=\"font-size:9.5px;color:#8fa397;margin-top:5px\">BORDER<br>#c9a86a default<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1\">\n              <div style=\"height:38px;background:#2f52a8;border:1px solid #24352b\"><\u002Fdiv>\n              <div style=\"font-size:9.5px;color:#8fa397;margin-top:5px\">COAT<br>#2f52a8 default<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #2e4136;padding-bottom:8px\">\n        <div style=\"font-size:11px;color:#7a8f83;letter-spacing:2px\">02<\u002Fdiv>\n        <div style=\"font-size:20px;color:#c9a86a;letter-spacing:3px\">TYPE<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#8fa397;line-height:1.6;margin-top:12px;max-width:720px\">One family, everywhere, including inputs and selects: <b style=\"color:#cfd8d3;font-weight:normal\">\"Courier New\", monospace<\u002Fb>. It is set at half-pixel sizes on purpose — 11.5 and 12.5 exist because 11 was thin and 12 was loud. Weight is never bold; emphasis is colour, and <span style=\"color:#c9a86a\">&lt;b&gt; is redefined to font-weight:normal<\u002Fspan> wherever it appears.<\u002Fdiv>\n\n      <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:6px 16px;margin-top:22px\">\n        <div style=\"display:flex;gap:18px;align-items:baseline;padding:11px 0;border-bottom:1px solid #182219\">\n          <div style=\"flex:0 0 66px;font-size:11px;color:#c9a86a\">52px<\u002Fdiv>\n          <div style=\"flex:0 0 130px;font-size:10.5px;color:#7a8f83;line-height:1.4\">14px tracking<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;font-size:34px;letter-spacing:9px;color:#cfd8d3;text-shadow:0 3px 0 #000\">FORESTER<\u002Fdiv>\n          <div style=\"flex:0 0 210px;font-size:10.5px;color:#7a8f83;line-height:1.45\">The title card. 34px / 6px on a phone.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline;padding:11px 0;border-bottom:1px solid #182219\">\n          <div style=\"flex:0 0 66px;font-size:11px;color:#c9a86a\">44px<\u002Fdiv>\n          <div style=\"flex:0 0 130px;font-size:10.5px;color:#7a8f83;line-height:1.4\">10px tracking<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;font-size:26px;letter-spacing:6px;color:#d86a5a;text-shadow:0 3px 0 #000\">THE COLONY IS GONE<\u002Fdiv>\n          <div style=\"flex:0 0 210px;font-size:10.5px;color:#7a8f83;line-height:1.45\">Game over, in blood.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline;padding:11px 0;border-bottom:1px solid #182219\">\n          <div style=\"flex:0 0 66px;font-size:11px;color:#c9a86a\">17px<\u002Fdiv>\n          <div style=\"flex:0 0 130px;font-size:10.5px;color:#7a8f83;line-height:1.4\">0.4px tracking<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;font-size:17px;color:#f0dcae;letter-spacing:0.4px;text-shadow:0 2px 4px #000\">No stone in the store<\u002Fdiv>\n          <div style=\"flex:0 0 210px;font-size:10.5px;color:#7a8f83;line-height:1.45\">#msg — a refusal over the field.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline;padding:11px 0;border-bottom:1px solid #182219\">\n          <div style=\"flex:0 0 66px;font-size:11px;color:#c9a86a\">15px<\u002Fdiv>\n          <div style=\"flex:0 0 130px;font-size:10.5px;color:#7a8f83;line-height:1.4\">1.5px tracking<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;font-size:15px;color:#c9a86a;letter-spacing:1.5px\">THE CHRONICLE<\u002Fdiv>\n          <div style=\"flex:0 0 210px;font-size:10.5px;color:#7a8f83;line-height:1.45\">A record panel's title.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline;padding:11px 0;border-bottom:1px solid #182219\">\n          <div style=\"flex:0 0 66px;font-size:11px;color:#c9a86a\">13px<\u002Fdiv>\n          <div style=\"flex:0 0 130px;font-size:10.5px;color:#7a8f83;line-height:1.4\">1px tracking<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;font-size:13px;color:#c9a86a;letter-spacing:1px\">GOVERNMENT OF NEU HAMBURG<\u002Fdiv>\n          <div style=\"flex:0 0 210px;font-size:10.5px;color:#7a8f83;line-height:1.45\">A panel title. 14px for a building.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline;padding:11px 0;border-bottom:1px solid #182219\">\n          <div style=\"flex:0 0 66px;font-size:11px;color:#c9a86a\">12.5px<\u002Fdiv>\n          <div style=\"flex:0 0 130px;font-size:10.5px;color:#7a8f83;line-height:1.4\">1.55 line-height<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;font-size:12.5px;color:#dde5df\">A child was born to Hanne Vogt.<\u002Fdiv>\n          <div style=\"flex:0 0 210px;font-size:10.5px;color:#7a8f83;line-height:1.45\">Prose to be read: chronicle, roll, inputs.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline;padding:11px 0;border-bottom:1px solid #182219\">\n          <div style=\"flex:0 0 66px;font-size:11px;color:#c9a86a\">12px<\u002Fdiv>\n          <div style=\"flex:0 0 130px;font-size:10.5px;color:#7a8f83;line-height:1.4\">1.5 line-height<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;font-size:12px;color:#cfd8d3\">Deposit goods to town storage<\u002Fdiv>\n          <div style=\"flex:0 0 210px;font-size:10.5px;color:#7a8f83;line-height:1.45\">The body default. Panels, buttons, rows.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline;padding:11px 0;border-bottom:1px solid #182219\">\n          <div style=\"flex:0 0 66px;font-size:11px;color:#c9a86a\">11.5px<\u002Fdiv>\n          <div style=\"flex:0 0 130px;font-size:10.5px;color:#7a8f83;line-height:1.4\">—<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;font-size:11.5px;color:#a8bcae\">bread in store +6<\u002Fdiv>\n          <div style=\"flex:0 0 210px;font-size:10.5px;color:#7a8f83;line-height:1.45\">Chips, help rows, dense values.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline;padding:11px 0;border-bottom:1px solid #182219\">\n          <div style=\"flex:0 0 66px;font-size:11px;color:#c9a86a\">11px<\u002Fdiv>\n          <div style=\"flex:0 0 130px;font-size:10.5px;color:#7a8f83;line-height:1.4\">—<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;font-size:11px;color:#7a8f83\">SPRING, DAY 4<\u002Fdiv>\n          <div style=\"flex:0 0 210px;font-size:10.5px;color:#7a8f83;line-height:1.45\">Notes, timestamps, ledgers.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline;padding:11px 0\">\n          <div style=\"flex:0 0 66px;font-size:11px;color:#c9a86a\">10px<\u002Fdiv>\n          <div style=\"flex:0 0 130px;font-size:10.5px;color:#7a8f83;line-height:1.4\">2px tracking<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;font-size:10px;color:#7da083;letter-spacing:2px\">GIVING ORDERS<\u002Fdiv>\n          <div style=\"flex:0 0 210px;font-size:10.5px;color:#7a8f83;line-height:1.45\">Section heads and the smallest print. Never smaller.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:22px\">\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:14px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;margin-bottom:9px\">A PANEL TITLE<\u002Fdiv>\n          <h3 style=\"font-size:13px;color:#c9a86a;letter-spacing:1px;margin:0 0 6px;font-weight:normal\">GOVERNMENT OF NEU HAMBURG<\u002Fh3>\n          <div style=\"font-size:10.5px;color:#7a8f83;line-height:1.5\">13px, gold, 1px tracking, caps. Sheets drop it to 11px and 0.5px tracking.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:14px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;margin-bottom:9px\">A SECTION HEAD<\u002Fdiv>\n          <h4 style=\"font-size:12px;color:#7da083;margin:0 0 6px;font-weight:normal\">PROFESSIONS<\u002Fh4>\n          <div style=\"font-size:10.5px;color:#7a8f83;line-height:1.5\">12px spruce, no tracking, inside a panel. In the help sheet the same rank gets 10px, 2px tracking and a hairline under it.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:14px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;margin-bottom:9px\">A FOOTNOTE<\u002Fdiv>\n          <div style=\"font-size:11px;color:#5a6b60;line-height:1.5;margin-bottom:6px\">Weapon laws decide who fights back with steel when unrest turns to rebellion.<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#7a8f83;line-height:1.5\">10–11px, #5a6b60. The quietest thing on screen. Always the last line of a group.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #2e4136;padding-bottom:8px\">\n        <div style=\"font-size:11px;color:#7a8f83;letter-spacing:2px\">03<\u002Fdiv>\n        <div style=\"font-size:20px;color:#c9a86a;letter-spacing:3px\">GEOMETRY &amp; SPACE<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px\">\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:16px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:12px\">MEASURES<\u002Fdiv>\n          <sc-for list=\"{{ measures }}\" as=\"m\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;gap:14px;padding:6px 0;border-bottom:1px solid #182219;font-size:11.5px\">\n              <div style=\"flex:0 0 150px;color:#8fa397\">{{ m.k }}<\u002Fdiv>\n              <div style=\"flex:1;color:#e0d3ac\">{{ m.v }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:16px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:12px\">THE ONE CURVE IN THE GAME<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#b9c6bd;line-height:1.6;margin-bottom:14px\">Every rectangle is square-cornered — except a tech node, which carries <span style=\"color:#c9a86a\">rx: 8<\u002Fspan>, and a touch button, which is a full circle. Those two are deliberate; a third would be a mistake.<\u002Fdiv>\n          <div style=\"display:flex;gap:14px;align-items:center\">\n            <svg width=\"140\" height=\"46\" style=\"display:block\"><rect x=\"1\" y=\"1\" width=\"138\" height=\"44\" rx=\"8\" fill=\"#14201a\" stroke=\"#c9a86a\"><\u002Frect><text x=\"10\" y=\"20\" fill=\"#cfd8d3\" style=\"font:11px 'Courier New',monospace\">Crop Rotation<\u002Ftext><text x=\"10\" y=\"34\" fill=\"#7a8f83\" style=\"font:9px 'Courier New',monospace\">40 · growth<\u002Ftext><\u002Fsvg>\n            <div style=\"width:46px;height:46px;border-radius:50%;background:rgba(20,32,26,0.92);border:1px solid #3a5243;color:#cfd8d3;font-size:17px;display:flex;align-items:center;justify-content:center\">↻<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #2e4136;padding-bottom:8px\">\n        <div style=\"font-size:11px;color:#7a8f83;letter-spacing:2px\">04<\u002Fdiv>\n        <div style=\"font-size:20px;color:#c9a86a;letter-spacing:3px\">THE LEDGER OF LAYERS<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#8fa397;line-height:1.6;margin-top:12px;max-width:720px\">A refusal the player cannot see reads as a broken button. The stack is fixed, and anything new must be given a number in it rather than a guess.<\u002Fdiv>\n      <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:6px 16px;margin-top:20px\">\n        <sc-for list=\"{{ layers }}\" as=\"l\" hint-placeholder-count=\"10\">\n          <div style=\"display:flex;gap:16px;align-items:baseline;padding:7px 0;border-bottom:1px solid #182219;font-size:11.5px\">\n            <div style=\"flex:0 0 54px;color:#c9a86a\">{{ l.z }}<\u002Fdiv>\n            <div style=\"flex:0 0 230px;color:#e6ece8\">{{ l.what }}<\u002Fdiv>\n            <div style=\"flex:1;color:#7a8f83;line-height:1.5\">{{ l.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #2e4136;padding-bottom:8px\">\n        <div style=\"font-size:11px;color:#7a8f83;letter-spacing:2px\">05<\u002Fdiv>\n        <div style=\"font-size:20px;color:#c9a86a;letter-spacing:3px\">THE PARTS<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:11px;letter-spacing:2px;color:#7da083;margin:30px 0 4px\">THE GLASS — .panel<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#7a8f83;line-height:1.55;max-width:760px;margin-bottom:14px\">Every floating thing in the game is one class: <span style=\"color:#e0d3ac\">position:fixed; background:rgba(13,18,16,0.93); border:1px solid #3a5243; font-size:12px<\u002Fspan>. Docked bars keep only the edge that faces the field — the HUD drops three borders and keeps its bottom, the action bar keeps its top.<\u002Fdiv>\n      <div style=\"border:1px solid #24352b;background:#0f1713;padding:18px\">\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;font-size:12px;display:flex;gap:13px;padding:7px 12px;border-width:0 0 1px 0;align-items:center;flex-wrap:wrap;background-image:none\">\n          <span style=\"color:#c9a86a;letter-spacing:2px\">NEU HAMBURG<\u002Fspan>\n          <span>LOGS <b style=\"color:#c9a86a;font-weight:normal\">128<\u002Fb><\u002Fspan>\n          <span>SEEDS <b style=\"color:#c9a86a;font-weight:normal\">34<\u002Fb><\u002Fspan>\n          <span>STONE <b style=\"color:#c9a86a;font-weight:normal\">61<\u002Fb><\u002Fspan>\n          <span>BREAD <b style=\"color:#c9a86a;font-weight:normal\">19<\u002Fb><\u002Fspan>\n          <span>DM <b style=\"color:#c9a86a;font-weight:normal\">240<\u002Fb><\u002Fspan>\n          <span style=\"flex:1\"><\u002Fspan>\n          <span>POP <b style=\"color:#c9a86a;font-weight:normal\">14<\u002Fb><\u002Fspan>\n          <span>HAPPY <b style=\"color:#c9a86a;font-weight:normal\">72<\u002Fb><\u002Fspan>\n          <span>TAXES IN <b style=\"color:#c9a86a;font-weight:normal\">2:14<\u002Fb><\u002Fspan>\n          <span><b style=\"color:#c9a86a;font-weight:normal\">AUTUMN<\u002Fb><\u002Fspan>\n          <span><b style=\"color:#c9a86a;font-weight:normal\">☀ 6:00 AM<\u002Fb><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:120px;display:flex;align-items:center;justify-content:center;background:#101813\">\n          <img src=\"dcc0ee80-b027-4597-84c4-e818f3e0cb6c\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;image-rendering:pixelated;opacity:0.5\">\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;font-size:12px;display:flex;gap:8px;padding:8px 14px;border-width:1px 0 0 0;align-items:center;flex-wrap:wrap\">\n          <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer\" style-hover=\"background:#24352b\"><i style=\"font-style:normal;margin-right:5px\">🏗<\u002Fi>BUILD ▾<\u002Fbutton>\n          <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer\" style-hover=\"background:#24352b\"><i style=\"font-style:normal;margin-right:5px\">⚒<\u002Fi>CRAFT ▾<\u002Fbutton>\n          <button style=\"background:#3a5243;color:#cfd8d3;border:1px solid #7da083;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer\"><i style=\"font-style:normal;margin-right:5px\">🛣<\u002Fi>ROADS<\u002Fbutton>\n          <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer\" style-hover=\"background:#24352b\"><i style=\"font-style:normal;margin-right:5px\">🏛<\u002Fi>GOVERNMENT<\u002Fbutton>\n          <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer\" style-hover=\"background:#24352b\"><i style=\"font-style:normal;margin-right:5px\">📜<\u002Fi>CHRONICLE<\u002Fbutton>\n          <span style=\"flex:1\"><\u002Fspan>\n          <span style=\"font-size:11px;color:#5a6b60\">FORESTER beta<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:11px;letter-spacing:2px;color:#7da083;margin:34px 0 4px\">BUTTONS — .btn AND ITS FOUR MOODS<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#7a8f83;line-height:1.55;max-width:760px;margin-bottom:14px\">One base, four states, no fifth. Hover lifts the fill to #24352b; active swaps fill for the border colour and lights the edge spruce; disabled is opacity 0.4 with a default cursor; danger keeps the fill and turns edge and ink to rust.<\u002Fdiv>\n      <div style=\"border:1px solid #24352b;background:#0f1713;padding:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center\">\n        <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer\" style-hover=\"background:#24352b\">Rename<\u002Fbutton>\n        <button style=\"background:#24352b;color:#cfd8d3;border:1px solid #3a5243;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer\">Rename — hover<\u002Fbutton>\n        <button style=\"background:#3a5243;color:#cfd8d3;border:1px solid #7da083;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer\">Growth — active<\u002Fbutton>\n        <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;padding:7px 12px;font-family:inherit;font-size:12px;cursor:default;opacity:0.4\">Recruit — disabled<\u002Fbutton>\n        <button style=\"background:#1c2a21;color:#d8a0a0;border:1px solid #7a4040;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer\" style-hover=\"background:#2a1a1a\">Dismantle<\u002Fbutton>\n        <button style=\"background:#1d1414;border:1px solid #4a2f2f;color:#d8a0a0;font-family:inherit;font-size:11px;padding:5px 8px;cursor:pointer\" style-hover=\"background:#2a1a1a;border-color:#7a4040\">delete<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:16px\">\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:13px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;margin-bottom:8px\">FULL-WIDTH IN A PANEL<\u002Fdiv>\n          <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer;width:100%;margin-bottom:6px\" style-hover=\"background:#24352b\">Heal — send to the hospital &nbsp;[H]<\u002Fbutton>\n          <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer;width:100%\" style-hover=\"background:#24352b\">Deposit goods to town storage &nbsp;[G]<\u002Fbutton>\n          <div style=\"font-size:10px;color:#5a6b60;margin-top:8px;line-height:1.5\">A key in square brackets, at the end, after a non-breaking space. Never a separate hint line.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:13px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;margin-bottom:8px\">A DROPPED MENU<\u002Fdiv>\n          <div style=\"background:#14201a;border:1px solid #3a5243\">\n            <button style=\"background:#1c2a21;color:#cfd8d3;border:none;border-bottom:1px solid #24352b;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer;display:block;width:100%;text-align:left\" style-hover=\"background:#24352b\">Log Cabin<\u002Fbutton>\n            <button style=\"background:#1c2a21;color:#cfd8d3;border:none;border-bottom:1px solid #24352b;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer;display:block;width:100%;text-align:left\" style-hover=\"background:#24352b\">Wheat Farm — 3 logs, 6 seeds<\u002Fbutton>\n            <button style=\"background:#1c2a21;color:#cfd8d3;border:none;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer;display:block;width:100%;text-align:left\" style-hover=\"background:#24352b\">Forge — 20 logs, 6 stone, 2 iron<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:10px;color:#5a6b60;margin-top:8px;line-height:1.5\">Fill #14201a, min-width 250px, opens upward from the action bar. Cost follows the name after an em dash, in plain ink.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:13px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;margin-bottom:8px\">FIELDS<\u002Fdiv>\n          <input type=\"text\" placeholder=\"search the record — a name, a place, a year\" style=\"width:100%;background:#101813;border:1px solid #3a5243;color:#cfd8d3;font-family:inherit;font-size:12.5px;padding:6px 8px;margin-bottom:8px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin:6px 0;font-size:12px\">\n            <span>Tax per civilian<\u002Fspan>\n            <span><input type=\"range\" min=\"0\" max=\"10\" value=\"3\" style=\"width:110px;accent-color:#7da083\"> <b style=\"color:#c9a86a;font-weight:normal\">3<\u002Fb> DM<\u002Fspan>\n          <\u002Fdiv>\n          <label style=\"display:flex;gap:6px;align-items:center;margin:4px 0;cursor:pointer;font-size:12px\"><input type=\"checkbox\" checked=\"{{ true }}\" style=\"accent-color:#7da083\"> Hunters may keep weapons<\u002Flabel>\n          <div style=\"font-size:10px;color:#5a6b60;margin-top:8px;line-height:1.5\">Inputs sit in a well of #101813 inside a #3a5243 edge. accent-color is always #7da083.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:11px;letter-spacing:2px;color:#7da083;margin:34px 0 4px\">MEASURES — .barwrap / .barfill<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start;margin-top:14px\">\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;font-size:12px\">\n          <h3 style=\"font-size:13px;color:#c9a86a;margin:0 0 6px;letter-spacing:1px;font-weight:normal\">HANNE VOGT<\u002Fh3>\n          <div style=\"display:flex;justify-content:space-between;margin:3px 0\"><span>Profession<\u002Fspan><span style=\"color:#a8bcae\">Forager<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;margin:3px 0\"><span>Health<\u002Fspan><span>62<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#101813;border:1px solid #24352b;height:10px;margin:3px 0 6px\"><div style=\"background:#a05252;height:100%;width:62%\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;margin:3px 0\"><span>Hunger<\u002Fspan><span>88<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#101813;border:1px solid #24352b;height:10px;margin:3px 0 6px\"><div style=\"background:#7da083;height:100%;width:88%\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;margin:3px 0\"><span>Happiness<\u002Fspan><span>44<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#101813;border:1px solid #24352b;height:10px;margin:3px 0 6px\"><div style=\"background:#7da083;height:100%;width:44%\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:3px 5px;margin:2px 0 7px\">\n            <span style=\"font-size:10.5px;line-height:1.45;padding:1px 5px;border:1px solid #4a2f2f;white-space:nowrap;color:#d8a0a0;background:#1d1414\">taxed hard −12<\u002Fspan>\n            <span style=\"font-size:10.5px;line-height:1.45;padding:1px 5px;border:1px solid #4a2f2f;white-space:nowrap;color:#d8a0a0;background:#1d1414\">no roof −9<\u002Fspan>\n            <span style=\"font-size:10.5px;line-height:1.45;padding:1px 5px;border:1px solid #2c4030;white-space:nowrap;color:#9ecf9a;background:#141d16\">bread in store +6<\u002Fspan>\n          <\u002Fdiv>\n          <hr style=\"border:none;border-top:1px solid #24352b;margin:7px 0\">\n          <div style=\"color:#7da083;margin-bottom:4px\">INVENTORY<\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;margin:3px 0\"><span>Logs<\u002Fspan><span>4<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;margin:3px 0\"><span>Deutsche Mark<\u002Fspan><span>11<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11.5px;color:#7a8f83;line-height:1.6;max-width:620px\">A meter is a bordered well with a flat fill and no animation, no gradient, no label inside it. The number lives in the row above, right-aligned, and the bar underneath is a picture of it.<\u002Fdiv>\n          <div style=\"margin-top:16px;background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:6px 14px\">\n            <sc-for list=\"{{ barRules }}\" as=\"b\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;gap:14px;padding:7px 0;border-bottom:1px solid #182219;font-size:11.5px\">\n                <div style=\"flex:0 0 128px;color:#c9a86a\">{{ b.k }}<\u002Fdiv>\n                <div style=\"flex:1;color:#8fa397;line-height:1.5\">{{ b.v }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:16px;font-size:11px;letter-spacing:2px;color:#7da083;margin-bottom:9px\">THE ONE GRADIENT IN THE GAME<\u002Fdiv>\n          <div style=\"background:#101813;border:1px solid #24352b;height:12px;max-width:400px\"><div style=\"background:linear-gradient(90deg,#a05252,#c9a86a,#7da083);height:100%;width:62%\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#7a8f83;margin-top:7px;line-height:1.5\">Willingness, in a talk. Rust through gold to spruce, 12px tall, and it is the only gradient permitted anywhere in the interface.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:11px;letter-spacing:2px;color:#7da083;margin:34px 0 4px\">RECORDS — THE CHRONICLE AND THE ROLL<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#7a8f83;line-height:1.55;max-width:760px;margin-bottom:14px\">Prose to be read, not a status line to be glanced at: 12.5px, line-height 1.55, a #182219 divider between rows and a #16231b wash on hover. Fixed-width columns for the time and the mark; the sentence takes the rest.<\u002Fdiv>\n      <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;max-width:760px\">\n        <h3 style=\"font-size:15px;color:#c9a86a;letter-spacing:1.5px;margin:0 0 10px;font-weight:normal\">THE CHRONICLE OF THE COLONY<\u002Fh3>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap\">\n          <input type=\"text\" placeholder=\"search the record — a name, a place, a year\" style=\"flex:1;min-width:120px;background:#101813;border:1px solid #3a5243;color:#cfd8d3;font-family:inherit;font-size:12.5px;padding:6px 8px\">\n          <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;font-family:inherit;font-size:10px;padding:4px 8px;cursor:pointer\" style-hover=\"background:#24352b\">✦ Ambitions<\u002Fbutton>\n          <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;font-family:inherit;font-size:10px;padding:4px 8px;cursor:pointer\" style-hover=\"background:#24352b\">close<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap\">\n          <span style=\"background:#3a5243;border:1px solid #7da083;color:#f0f6ee;font-size:11.5px;padding:5px 10px;cursor:pointer\">all<\u002Fspan>\n          <span style=\"background:#14201a;border:1px solid #3a5243;color:#a8bcae;font-size:11.5px;padding:5px 10px;cursor:pointer\" style-hover=\"border-color:#7da083\">deaths<\u002Fspan>\n          <span style=\"background:#14201a;border:1px solid #3a5243;color:#a8bcae;font-size:11.5px;padding:5px 10px;cursor:pointer\" style-hover=\"border-color:#7da083\">laws<\u002Fspan>\n          <span style=\"background:#14201a;border:1px solid #3a5243;color:#a8bcae;font-size:11.5px;padding:5px 10px;cursor:pointer\" style-hover=\"border-color:#7da083\">war<\u002Fspan>\n          <span style=\"background:#14201a;border:1px solid #3a5243;color:#a8bcae;font-size:11.5px;padding:5px 10px;cursor:pointer\" style-hover=\"border-color:#7da083\">illness<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #24352b\">\n          <div style=\"color:#d9b878;font-size:12.5px;padding:9px 2px 4px;border-bottom:1px solid #2e4136;letter-spacing:2px\">1686<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;padding:6px 3px;border-bottom:1px solid #182219;font-size:12.5px;line-height:1.55\" style-hover=\"background:#16231b\">\n            <div style=\"color:#7d9187;flex:0 0 100px;white-space:nowrap\">SPRING, DAY 4<\u002Fdiv>\n            <div style=\"flex:0 0 16px;text-align:center;color:#9ecf9a;font-size:13px\">✿<\u002Fdiv>\n            <div style=\"flex:1;color:#dde5df\">A child was born to Hanne Vogt. They named her Grete, after the aunt left behind in Hamburg.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;padding:6px 3px;border-bottom:1px solid #182219;font-size:12.5px;line-height:1.55\" style-hover=\"background:#16231b\">\n            <div style=\"color:#7d9187;flex:0 0 100px;white-space:nowrap\">SPRING, DAY 9<\u002Fdiv>\n            <div style=\"flex:0 0 16px;text-align:center;color:#d8a05a;font-size:13px\">§<\u002Fdiv>\n            <div style=\"flex:1;color:#dde5df\">The tax was set to four marks a head. Two men said openly that it was theft.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;padding:6px 3px;border-bottom:1px solid #182219;font-size:12.5px;line-height:1.55\" style-hover=\"background:#16231b\">\n            <div style=\"color:#7d9187;flex:0 0 100px;white-space:nowrap\">SUMMER, DAY 1<\u002Fdiv>\n            <div style=\"flex:0 0 16px;text-align:center;color:#a99ec4;font-size:13px\">☣<\u002Fdiv>\n            <div style=\"flex:1;color:#dde5df\">A fever came up out of the low ground. Three took to their beds; the doctor sat with all of them.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;padding:6px 3px;border-bottom:1px solid #182219;font-size:12.5px;line-height:1.55\" style-hover=\"background:#16231b\">\n            <div style=\"color:#7d9187;flex:0 0 100px;white-space:nowrap\">SUMMER, DAY 6<\u002Fdiv>\n            <div style=\"flex:0 0 16px;text-align:center;color:#d86a5a;font-size:13px\">⚔<\u002Fdiv>\n            <div style=\"flex:1;color:#dde5df\">Raiders came at the north wall in the dark and were beaten off. Klaus Enders did not come back in.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#7d9187;margin-top:8px\">4 of 218 entries<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:22px;margin-top:16px;flex-wrap:wrap\">\n        <sc-for list=\"{{ eventInks }}\" as=\"e\" hint-placeholder-count=\"5\">\n          <div style=\"font-size:11px;color:#8fa397;display:flex;gap:7px;align-items:baseline\">\n            <span style=\"font-size:13px;color:{{ e.hex }}\">{{ e.glyph }}<\u002Fspan>\n            <span>{{ e.label }}<\u002Fspan>\n            <span style=\"color:#7a8f83\">{{ e.hex }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:34px;align-items:start\">\n        <div>\n          <div style=\"font-size:11px;letter-spacing:2px;color:#7da083;margin-bottom:9px\">WORD FROM AFAR — #eventCard<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#7a8f83;line-height:1.55;margin-bottom:14px\">The only component with a shadow and the only one with a warmer edge (#8a7746). It lives in the top-right corner — never across the middle: word from afar should never sit between the player and their own town. Fades in over 0.4s with a 14px slide, settles at 0.96 opacity.<\u002Fdiv>\n          <div style=\"width:268px;background:rgba(9,13,11,0.9);border:1px solid #8a7746;box-shadow:0 4px 16px rgba(0,0,0,0.5);text-align:center;padding-bottom:8px\">\n            <img src=\"11733861-19f3-4fb0-b5c2-3a59c1cb68dc\" alt=\"\" style=\"width:100%;display:block;image-rendering:pixelated;border-bottom:1px solid #3a5243\">\n            <div style=\"font-size:13px;line-height:1.3;color:#e8d9b8;letter-spacing:0.4px;padding:7px 10px 0;text-shadow:0 2px 3px #000\">Sweden has declared war upon the Falkenwald Compact.<\u002Fdiv>\n            <div style=\"font-size:9px;color:#7a8f83;padding:4px 10px 0;letter-spacing:0.6px\">CLICK FOR THE MAP<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11px;letter-spacing:2px;color:#7da083;margin-bottom:9px\">A TALK — #dialogue<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#7a8f83;line-height:1.55;margin-bottom:14px\">A pixel portrait at 96px with a spruce edge, the name in gold, the words in 12px at 1.5, then the willingness meter, then the choices as full-width left-aligned buttons stacked 6px apart.<\u002Fdiv>\n          <div style=\"width:100%;max-width:470px;background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:14px;font-size:12px\">\n            <div style=\"display:flex;gap:12px;margin-bottom:10px\">\n              <img src=\"1a6ee289-8ce6-4518-8095-ae9c24e55341\" alt=\"visitor\" style=\"width:96px;height:96px;image-rendering:pixelated;border:1px solid #3a5243\">\n              <div>\n                <div style=\"color:#c9a86a;font-size:14px;margin-bottom:6px\">Wandering Hunter<\u002Fdiv>\n                <div style=\"font-size:12px;line-height:1.5\">I have walked since the thaw and seen no smoke but yours. There is meat on my back and no roof over it.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>Willingness<\u002Fdiv>\n            <div style=\"background:#101813;border:1px solid #24352b;height:12px;margin:10px 0\"><div style=\"background:linear-gradient(90deg,#a05252,#c9a86a,#7da083);height:100%;width:55%\"><\u002Fdiv><\u002Fdiv>\n            <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer;display:block;width:100%;text-align:left;margin-top:6px\" style-hover=\"background:#24352b\">Offer him a cabin and a place on the roll.<\u002Fbutton>\n            <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer;display:block;width:100%;text-align:left;margin-top:6px\" style-hover=\"background:#24352b\">Buy the meat and send him on. — 8 DM<\u002Fbutton>\n            <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer;display:block;width:100%;text-align:left;margin-top:6px\" style-hover=\"background:#24352b\">Turn him away.<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:34px;align-items:start\">\n        <div>\n          <div style=\"font-size:11px;letter-spacing:2px;color:#7da083;margin-bottom:9px\">THE TECH GRAPH — .tnode<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#7a8f83;line-height:1.55;margin-bottom:14px\">Four states carried entirely by the stroke: locked is the base edge at 0.42 opacity, available is gold, researching is gold dashed 4&nbsp;3, done fills to #1c2a21 and turns edge and text spruce. Links are #3a5243 at 1.5px.<\u002Fdiv>\n          <div style=\"border:1px solid #24352b;background:#0f1713;padding:16px\">\n            <svg width=\"100%\" height=\"150\" sc-camel-view-box=\"0 0 420 150\" style=\"display:block\">\n              <path d=\"M130 34 C170 34 170 76 210 76\" fill=\"none\" stroke=\"#3a5243\" stroke-width=\"1.5\"><\u002Fpath>\n              <path d=\"M130 116 C170 116 170 76 210 76\" fill=\"none\" stroke=\"#3a5243\" stroke-width=\"1.5\"><\u002Fpath>\n              <path d=\"M330 76 L360 76\" fill=\"none\" stroke=\"#3a5243\" stroke-width=\"1.5\"><\u002Fpath>\n              <g><rect x=\"10\" y=\"12\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#1c2a21\" stroke=\"#7da083\"><\u002Frect><text x=\"20\" y=\"32\" fill=\"#7da083\" style=\"font:11px 'Courier New',monospace\">Husbandry<\u002Ftext><text x=\"20\" y=\"46\" fill=\"#7a8f83\" style=\"font:9px 'Courier New',monospace\">done<\u002Ftext><\u002Fg>\n              <g><rect x=\"10\" y=\"94\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#14201a\" stroke=\"#c9a86a\" stroke-dasharray=\"4 3\"><\u002Frect><text x=\"20\" y=\"114\" fill=\"#cfd8d3\" style=\"font:11px 'Courier New',monospace\">Masonry<\u002Ftext><text x=\"20\" y=\"128\" fill=\"#7a8f83\" style=\"font:9px 'Courier New',monospace\">researching — 62%<\u002Ftext><\u002Fg>\n              <g><rect x=\"210\" y=\"54\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#14201a\" stroke=\"#c9a86a\"><\u002Frect><text x=\"220\" y=\"74\" fill=\"#cfd8d3\" style=\"font:11px 'Courier New',monospace\">Crop Rotation<\u002Ftext><text x=\"220\" y=\"88\" fill=\"#7a8f83\" style=\"font:9px 'Courier New',monospace\">40 · available<\u002Ftext><\u002Fg>\n              <g opacity=\"0.42\"><rect x=\"360\" y=\"54\" width=\"60\" height=\"44\" rx=\"8\" fill=\"#14201a\" stroke=\"#3a5243\"><\u002Frect><text x=\"370\" y=\"80\" fill=\"#cfd8d3\" style=\"font:11px 'Courier New',monospace\">Mill<\u002Ftext><\u002Fg>\n            <\u002Fsvg>\n            <div style=\"font-size:11px;color:#9ab0a2;min-height:28px;margin-top:8px\">Click a lit node to research it. Hover for details.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11px;letter-spacing:2px;color:#7da083;margin-bottom:9px\">WHAT A BUILDING SAYS FOR ITSELF<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#7a8f83;line-height:1.55;margin-bottom:14px\">Purpose in prose first, then the numbers under a hairline: label left in #8fa397, value right in #e0d3ac. A destructive action is the last thing in the panel and always full width.<\u002Fdiv>\n          <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:12px;max-width:318px;font-size:12px\">\n            <h3 style=\"font-size:14px;color:#c9a86a;margin:0 0 8px;letter-spacing:1px;font-weight:normal\">FORGE<\u002Fh3>\n            <div style=\"font-size:12px;line-height:1.55;color:#b9c6bd;margin-bottom:9px\">A blacksmith works iron here into tools that make every other trade faster, and into weapons for the armoury.<\u002Fdiv>\n            <div style=\"border-top:1px solid #24352b;padding-top:6px;margin-bottom:8px\">\n              <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:12px;line-height:1.5;padding:2px 0\"><span style=\"color:#8fa397;flex:0 0 auto;white-space:nowrap\">Tools a day<\u002Fspan><b style=\"color:#e0d3ac;font-weight:normal;text-align:right\">2<\u002Fb><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:12px;line-height:1.5;padding:2px 0\"><span style=\"color:#8fa397;flex:0 0 auto;white-space:nowrap\">Iron per tool<\u002Fspan><b style=\"color:#e0d3ac;font-weight:normal;text-align:right\">1<\u002Fb><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:12px;line-height:1.5;padding:2px 0\"><span style=\"color:#8fa397;flex:0 0 auto;white-space:nowrap\">Upkeep<\u002Fspan><b style=\"color:#e0d3ac;font-weight:normal;text-align:right\">3 DM a week<\u002Fb><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;margin:3px 0\"><span>Occupants<\u002Fspan><span>Otto Reinhardt<\u002Fspan><\u002Fdiv>\n            <button style=\"background:#1c2a21;color:#d8a0a0;border:1px solid #7a4040;padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer;width:100%;margin-top:8px\" style-hover=\"background:#2a1a1a\">Dismantle<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:11px;letter-spacing:2px;color:#7da083;margin:34px 0 4px\">A REFUSAL, AND A TITLE CARD<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:14px;align-items:start\">\n        <div>\n          <div style=\"position:relative;border:1px solid #24352b;height:240px;overflow:hidden\">\n            <img src=\"dcc0ee80-b027-4597-84c4-e818f3e0cb6c\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;opacity:0.6\">\n            <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#f0dcae;font-size:17px;line-height:1.35;text-shadow:0 2px 4px #000,0 0 10px #000,0 0 18px #000;text-align:center;max-width:80%;letter-spacing:0.4px\">No stone in the store — the quarry is that way.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#7a8f83;line-height:1.55;margin-top:8px\">#msg — no plate, only shadow. A heavy triple shadow keeps it legible over grass or snow alike.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:relative;border:1px solid #24352b;height:240px;overflow:hidden;background:#0d1210\">\n          <img src=\"b2ffd4cc-c405-4b72-a194-23bd78aeee89\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated\">\n          <div style=\"position:absolute;inset:0;background:rgba(13,18,16,0.55)\"><\u002Fdiv>\n          <div style=\"position:relative;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center\">\n            <div style=\"font-size:34px;letter-spacing:9px;color:#cfd8d3;text-shadow:0 3px 0 #000\">FORESTER<\u002Fdiv>\n            <div style=\"font-size:12px;color:#9ab0a2;text-shadow:0 1px 2px #000\">Hamburg, 1683. They took everything. Build it back.<\u002Fdiv>\n            <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;font-family:inherit;font-size:14px;padding:10px 32px;cursor:pointer;margin-top:6px\" style-hover=\"background:#24352b\">NEW GAME<\u002Fbutton>\n            <div style=\"font-size:10px;color:#5a6b60\">beta — DeadlyDog Productions<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#7a8f83;line-height:1.6;margin-top:12px;max-width:820px\">Full-screen cards are the pixel scene, a wash of rgba(13,18,16,0.55–0.6) over it, and centred stacked text with a hard <span style=\"color:#e0d3ac\">0 3px 0 #000<\u002Fspan> drop — a woodcut shadow, not a blur. The title runs 52px at 14px tracking on a desk, 34px at 6px on a phone. Death takes the same card with the title in rust: <span style=\"color:#d86a5a\">THE COLONY IS GONE<\u002Fspan>.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #2e4136;padding-bottom:8px\">\n        <div style=\"font-size:11px;color:#7a8f83;letter-spacing:2px\">06<\u002Fdiv>\n        <div style=\"font-size:20px;color:#c9a86a;letter-spacing:3px\">THE PHONE LAW<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#8fa397;line-height:1.6;margin-top:12px;max-width:780px\">One breakpoint, written the same way every time: <span style=\"color:#e0d3ac\">@media (max-width: 820px), (pointer: coarse) and (max-width: 1100px)<\u002Fspan>. Below it the interface is not shrunk, it is rebuilt: side panels become bottom sheets, labels leave the buttons, and rows that were columns stack.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:22px\">\n        <sc-for list=\"{{ phoneRules }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:14px\">\n            <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:9px\">{{ p.head }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;line-height:1.6;color:#b9c6bd\">{{ p.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 300px;gap:22px;margin-top:22px;align-items:start\">\n        <div style=\"border:1px solid #24352b;background:#0f1713;padding:16px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;margin-bottom:10px\">A SHEET, AS IT SITS ON A PHONE<\u002Fdiv>\n          <div style=\"position:relative;height:300px;border:1px solid #24352b;overflow:hidden;max-width:300px;margin:0 auto\">\n            <img src=\"dcc0ee80-b027-4597-84c4-e818f3e0cb6c\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;opacity:0.55\">\n            <div style=\"position:absolute;top:0;left:0;right:0;background:rgba(13,18,16,0.93);border-bottom:1px solid #3a5243;display:flex;gap:8px;padding:5px 8px;font-size:9px;white-space:nowrap;overflow:hidden;align-items:center\">\n              <span style=\"color:#c9a86a;letter-spacing:1px\">NEU HAMBURG<\u002Fspan><span>POP <b style=\"color:#c9a86a;font-weight:normal\">14<\u002Fb><\u002Fspan><span><b style=\"color:#c9a86a;font-weight:normal\">☀ 6:00<\u002Fb><\u002Fspan><span>LOGS <b style=\"color:#c9a86a;font-weight:normal\">128<\u002Fb><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:6px;right:56px;bottom:44px;background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:6px 8px;font-size:10.5px;line-height:1.3;max-height:110px;overflow:hidden\">\n              <div style=\"font-size:10px;color:#c9a86a;letter-spacing:0.5px;margin-bottom:4px\">HANNE VOGT<\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;margin:1px 0\"><span>Health<\u002Fspan><span>62<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#101813;border:1px solid #24352b;height:6px;margin:1px 0 3px\"><div style=\"background:#a05252;height:100%;width:62%\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;margin:1px 0\"><span>Hunger<\u002Fspan><span>88<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#101813;border:1px solid #24352b;height:6px;margin:1px 0 3px\"><div style=\"background:#7da083;height:100%;width:88%\"><\u002Fdiv><\u002Fdiv>\n              <button style=\"background:#1c2a21;color:#cfd8d3;border:1px solid #3a5243;font-family:inherit;font-size:10px;padding:6px 8px;width:100%;margin-top:4px;cursor:pointer\">Heal<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"position:absolute;right:8px;bottom:52px;display:flex;flex-direction:column;gap:6px\">\n              <div style=\"width:38px;height:38px;border-radius:50%;background:rgba(20,32,26,0.92);border:1px solid #3a5243;color:#cfd8d3;font-size:15px;display:flex;align-items:center;justify-content:center\">↻<\u002Fdiv>\n              <div style=\"width:38px;height:38px;border-radius:50%;background:rgba(20,32,26,0.92);border:1px solid #c9a86a;color:#c9a86a;font-size:15px;display:flex;align-items:center;justify-content:center\">✕<\u002Fdiv>\n              <div style=\"width:38px;height:38px;border-radius:50%;background:rgba(20,32,26,0.92);border:1px solid #3a5243;color:#cfd8d3;font-size:15px;display:flex;align-items:center;justify-content:center\">⌂<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;bottom:0;left:0;right:0;background:rgba(13,18,16,0.93);border-top:1px solid #3a5243;display:flex;gap:6px;padding:6px 8px\">\n              <div style=\"background:#1c2a21;border:1px solid #3a5243;min-height:30px;min-width:34px;display:flex;align-items:center;justify-content:center;font-size:14px\">🏗<\u002Fdiv>\n              <div style=\"background:#1c2a21;border:1px solid #3a5243;min-height:30px;min-width:34px;display:flex;align-items:center;justify-content:center;font-size:14px\">⚒<\u002Fdiv>\n              <div style=\"background:#1c2a21;border:1px solid #3a5243;min-height:30px;min-width:34px;display:flex;align-items:center;justify-content:center;font-size:14px\">🏛<\u002Fdiv>\n              <div style=\"background:#1c2a21;border:1px solid #3a5243;min-height:30px;min-width:34px;display:flex;align-items:center;justify-content:center;font-size:14px\">👥<\u002Fdiv>\n              <div style=\"background:#1c2a21;border:1px solid #3a5243;min-height:30px;min-width:34px;display:flex;align-items:center;justify-content:center;font-size:14px\">📜<\u002Fdiv>\n              <div style=\"background:#1c2a21;border:1px solid #3a5243;min-height:30px;min-width:34px;display:flex;align-items:center;justify-content:center;font-size:14px\">🗺<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(13,18,16,0.93);border:1px solid #3a5243;padding:14px\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#7da083;border-bottom:1px solid #2c3b32;padding-bottom:4px;margin-bottom:10px\">FINGER SIZES<\u002Fdiv>\n          <div style=\"font-size:11.5px;line-height:1.7;color:#b9c6bd\">\n            <div>Round pad button — <span style=\"color:#e0d3ac\">46px<\u002Fspan>, 38px on a phone<\u002Fdiv>\n            <div>Action-bar button — min-height <span style=\"color:#e0d3ac\">38px<\u002Fspan><\u002Fdiv>\n            <div>Sheet button — min-height <span style=\"color:#e0d3ac\">30px<\u002Fspan><\u002Fdiv>\n            <div>Menu item — min-height <span style=\"col
